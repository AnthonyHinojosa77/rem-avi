name: Deploy RemAvi to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:requests
      - uses: actions/configure-pages@v5
        if: vars.PAGES_ENABLED == 'true'
        id: pages
      - run: pnpm build:pages
        env:
          PAGES_BASE_PATH: ${{ vars.PAGES_BASE_PATH || '/rem-avi/' }}
      - uses: actions/upload-artifact@v4
        with:
          name: remavi-static-site
          path: dist-pages
      - uses: actions/upload-pages-artifact@v3
        if: vars.PAGES_ENABLED == 'true'
        with:
          path: dist-pages
  deploy:
    if: vars.PAGES_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
